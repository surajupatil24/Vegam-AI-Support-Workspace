version: '3.8'

services:
  # PostgreSQL Database with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: samixa_postgres
    environment:
      POSTGRES_USER: samixa
      POSTGRES_PASSWORD: password
      POSTGRES_DB: samixa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samixa"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - samixa_network

  # Qdrant Vector Database (optional)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: samixa_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT_API_KEY: your_qdrant_key
    networks:
      - samixa_network

  # FastAPI Backend
  backend:
    build: ./backend
    container_name: samixa_backend
    command: sh -c "sleep 30 && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql://samixa:password@postgres:5432/samixa
      REDIS_URL: redis://redis:6379
      PYTHONUNBUFFERED: 1
      REDMINE_BASE_URL: https://support.vegam.co
      REDMINE_API_KEY: a2750e661d180e5fdf9b7e64c7acbdf85a34e987
      SECRET_KEY: your-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
    networks:
      - samixa_network

  # Next.js Frontend
  frontend:
    image: node:20-alpine
    container_name: samixa_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - samixa_network

  # Redis Cache (optional)
  redis:
    image: redis:7-alpine
    container_name: samixa_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - samixa_network

volumes:
  postgres_data:
  qdrant_data:
  redis_data:

networks:
  samixa_network:
    driver: bridge
